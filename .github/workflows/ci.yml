name: Verify application contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_boundaries.py
      - run: dotnet test apps/backend/Kcow.Backend.sln --logger trx
      - run: python scripts/check_cli.py
      - run: python scripts/check_operations.py
      - run: python scripts/check_legacy_tools.py
      - run: npm ci
        working-directory: apps/frontend
      - run: npm run typecheck
        working-directory: apps/frontend
      - run: npm test -- --runInBand
        working-directory: apps/frontend
      - run: npm run build
        working-directory: apps/frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/backend/tests/**/TestResults/*.trx
